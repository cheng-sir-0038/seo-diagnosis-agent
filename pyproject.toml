# ============================================================================
# 网站增长诊断 Agent
# ============================================================================
#
# 将多个 SEO 数据源的异构 API 翻译为统一数据模型，
# 通过单一入口 POST /api/v1/query 提供标准化查询接口。
#
# 数据查询使用 Provider + Facade 模式；诊断由 Agent 负责。
#
# ============================================================================

# 依赖继续由 requirements.txt 统一维护。
# uv 命令使用 --with-requirements requirements.txt 加载依赖。
[project]
name = "seo-diagnosis-agent"
version = "1.0.0a0"
description = "只读 SEO 诊断 Agent 和多源 SEO 数据适配"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
